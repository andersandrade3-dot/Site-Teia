<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Camisa TEIA 2026 — Modelo 3D Oficial</title>
  <style>
    :root {
      --bg1: #030303;
      --bg2: #0e0407;
      --accent: #ff1e42;
      --accent-glow: rgba(255, 30, 66, 0.45);
      --border: rgba(255, 255, 255, 0.12);
      --white: #ffffff;
      --white-dim: rgba(255, 255, 255, 0.7);
      --font-mono: 'JetBrains Mono', monospace, monospace;
      --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, var(--bg2) 0%, var(--bg1) 100%);
      font-family: var(--font-sans);
      color: var(--white);
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }

    /* Top HUD */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: var(--accent);
      background: rgba(255, 30, 66, 0.08);
      border: 1px solid rgba(255, 30, 66, 0.3);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 5px;
    }
    .hud-tag-dot {
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }
    .hud-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--white);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
    }
    .hud-sub {
      font-size: 0.72rem;
      color: var(--white-dim);
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    /* Bottom Control Bar */
    .hud-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 20;
      padding: 0 16px;
    }
    .ctrl-btn {
      background: rgba(18, 18, 18, 0.75);
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 18px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }
    .ctrl-btn.active {
      background: rgba(255, 30, 66, 0.25);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* Loading Overlay */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030303;
      z-index: 100;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 30, 66, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-txt {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: var(--white);
    }

    /* Drag Prompt Toast */
    .drag-hint {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(10, 10, 10, 0.65);
      padding: 4px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-txt">CARREGANDO MODELO 3D...</div>
  </div>

  <div class="hud-header">
    <div class="hud-tag"><span class="hud-tag-dot"></span><span>TEIA 2026 // ARMADURA OFICIAL</span></div>
    <h1 class="hud-title">CAMISA TEIA 2026</h1>
    <div class="hud-sub">Modelo Tridimensional Unificado 360° · Arraste para girar</div>
  </div>

  <div class="drag-hint">Arraste para girar &bull; Role para zoom</div>

  <div class="hud-controls">
    <button class="ctrl-btn" id="btnFront">FRENTE</button>
    <button class="ctrl-btn" id="btnBack">COSTAS</button>
    <button class="ctrl-btn active" id="btnAuto">⏸ GIRAR</button>
    <button class="ctrl-btn" id="btnReset">↺ RESET</button>
  </div>

  <canvas id="canvas3d"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const T = THREE;
    const cv = document.getElementById('canvas3d');
    const renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = T.sRGBEncoding;

    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0, 8.6);
    scene.add(camera);

    // Iluminação balanceada para destacar as cores e relevo da blusa
    scene.add(new T.AmbientLight(0xffffff, 0.72));

    const keyLight = new T.DirectionalLight(0xffffff, 0.75);
    keyLight.position.set(2, 3, 4);
    camera.add(keyLight);

    const fillLight = new T.DirectionalLight(0xffffff, 0.55);
    fillLight.position.set(-2.5, 1.5, -3.5);
    scene.add(fillLight);

    // Luz Neon Rubi sutil de contorno
    const rimLight = new T.PointLight(0xff1e42, 2.5, 14);
    rimLight.position.set(0, 1.5, -3.0);
    scene.add(rimLight);

    const shirtGroup = new T.Group();
    scene.add(shirtGroup);

    const TW = 900, TH = 1200, SC = 2.7 / TW, CY = 550, ST = 4;

      const i = new Image();
      i.onload = () => r(i);
      i.src = s;
    });

      for (let j = 0; j < gy; j++) {
        for (let i = 0; i < gx; i++) {
          const e = d[(j * gx + i) * 4];
          if (e > 0) {
            id[j * gx + i] = n++;
            const x = (i * ST - TW / 2) * SC;
            const y = (CY - j * ST) * SC;
            const z = ((e - 1) / 1.9) * SC;
            basePos.push(x, y, z);
            baseUV.push(i * ST / (TW - 1), 1 - j * ST / (TH - 1));
          }
        }
      }

      const N = n; // Total de vértices na frente

      // 2. CONSTRUÇÃO DAS FACES DA FRENTE (IF) E COSTAS (IB)
      const IF = [];
      const IB = [];

      for (let j = 0; j < gy - 1; j++) {
        for (let i = 0; i < gx - 1; i++) {
          const a  = id[j * gx + i];
          const b  = id[j * gx + i + 1];
          const cc = id[(j + 1) * gx + i];
          const dd = id[(j + 1) * gx + i + 1];

          if (a < 0 || b < 0 || cc < 0 || dd < 0) continue;

          // Triângulos da frente
          IF.push(a, cc, b, b, cc, dd);

          // Triângulos de costas (com deslocamento de índice +N e inversão de winding)
          IB.push(a + N, b + N, cc + N, b + N, dd + N, cc + N);
        }
      }

      // 3. IDENTIFICAÇÃO DAS BORDAS DIRECIONADAS DE CONTORNO (SEAM EDGES)
      const edgeDir = new Map();
      for (let k = 0; k < IF.length; k += 3) {
        const v1 = IF[k], v2 = IF[k + 1], v3 = IF[k + 2];
        edgeDir.set(v1 + '_' + v2, (edgeDir.get(v1 + '_' + v2) || 0) + 1);
        edgeDir.set(v2 + '_' + v3, (edgeDir.get(v2 + '_' + v3) || 0) + 1);
        edgeDir.set(v3 + '_' + v1, (edgeDir.get(v3 + '_' + v1) || 0) + 1);
      }

      const seamEdges = [];
      for (const [k] of edgeDir.entries()) {
        const [u, v] = k.split('_').map(Number);
        // Se a aresta reversa não existe, é uma aresta de contorno livre
        if (!edgeDir.has(v + '_' + u)) {
          seamEdges.push([u, v]);
        }
      }

      // 4. ARESTAS DE PONTE LATERAL (FECHAMENTO 100% UNIFICADO E CONTÍNUO)
      // Conecta o contorno frontal (u, v) ao contorno traseiro (u+N, v+N) com quads perfeitos
      const ISeam = [];
      for (const [u, v] of seamEdges) {
        // Triângulo 1: u -> v+N -> v
        // Triângulo 2: u -> u+N -> v+N
        ISeam.push(u, v + N, v);
        ISeam.push(u, u + N, v + N);
      }

      // 5. CRIAÇÃO DO ARRAY FINAL DE POSIÇÕES E UVS
      // Vértices 0..N-1: Frente (+Z)
      // Vértices N..2N-1: Costas (-Z)
      const finalPos = new Float32Array(N * 2 * 3);
      const finalUV  = new Float32Array(N * 2 * 2);

      // Frente
      for (let i = 0; i < N; i++) {
        finalPos[i * 3]     = basePos[i * 3];
        finalPos[i * 3 + 1] = basePos[i * 3 + 1];
        finalPos[i * 3 + 2] = basePos[i * 3 + 2];

        finalUV[i * 2]     = baseUV[i * 2];
        finalUV[i * 2 + 1] = baseUV[i * 2 + 1];
      }

      // Costas (Z invertido, e UV horizontal preservada para estampa direta e legível)
      for (let i = 0; i < N; i++) {
        const idxBack = N + i;
        finalPos[idxBack * 3]     = basePos[i * 3];
        finalPos[idxBack * 3 + 1] = basePos[i * 3 + 1];
        finalPos[idxBack * 3 + 2] = -basePos[i * 3 + 2]; // Inverte Z

        // Mapeamento correto e nítido
        finalUV[idxBack * 2]     = baseUV[i * 2];
        finalUV[idxBack * 2 + 1] = baseUV[i * 2 + 1];
      }

      // Combinação de todos os índices em uma ÚNICA geometria
      const allIndices = new Uint32Array(IF.length + IB.length + ISeam.length);
      allIndices.set(IF, 0);
      allIndices.set(IB, IF.length);
      allIndices.set(ISeam, IF.length + IB.length);

      const unifiedGeo = new T.BufferGeometry();
      unifiedGeo.setAttribute('position', new T.BufferAttribute(finalPos, 3));
      unifiedGeo.setAttribute('uv', new T.BufferAttribute(finalUV, 2));
      unifiedGeo.setIndex(new T.BufferAttribute(allIndices, 1));

      // Grupos de materiais na mesma malha contínua
      unifiedGeo.addGroup(0, IF.length, 0);                       // Frente (Textura Frente)
      unifiedGeo.addGroup(IF.length, IB.length, 1);               // Costas (Textura Costas)
      unifiedGeo.addGroup(IF.length + IB.length, ISeam.length, 2); // Costura lateral unificada (Tecido vinho)

      unifiedGeo.computeVertexNormals();

      // Texturas com máxima nitidez e fidelidade
      const texFront = new T.CanvasTexture(tf);
      texFront.encoding = T.sRGBEncoding;
      texFront.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const texBack = new T.CanvasTexture(tb);
      texBack.encoding = T.sRGBEncoding;
      texBack.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const matFront = new T.MeshStandardMaterial({
        map: texFront,
        roughness: 0.65,
        metalness: 0.05,
        alphaTest: 0.45,
        side: T.DoubleSide
      });

      const matBack = new T.MeshStandardMaterial({
        map: texBack,
        roughness: 0.65,
        metalness: 0.05,
        alphaTest: 0.45,
        side: T.DoubleSide
      });

      const matSeam = new T.MeshStandardMaterial({
        color: 0x4f0a16, // Tom bordô idêntico ao tecido da camisa
        roughness: 0.70,
        metalness: 0.04,
        side: T.DoubleSide
      });

      const shirtMesh = new T.Mesh(unifiedGeo, [matFront, matBack, matSeam]);
      shirtGroup.add(shirtMesh);

      // Cabide de madeira clássico no topo (holding hanger)
      const woodMat = new T.MeshLambertMaterial({ color: 0xb98a55 });
      const topY = (CY - 60) * SC;

      const hangerBar = new T.Mesh(new T.CylinderGeometry(0.014, 0.014, 0.12, 12), woodMat);
      hangerBar.position.set(0, topY + 0.03, 0);
      shirtGroup.add(hangerBar);

      const hangerHook = new T.Mesh(new T.TorusGeometry(0.065, 0.012, 8, 20, Math.PI * 1.5), woodMat);
      hangerHook.rotation.z = Math.PI / 2;
      hangerHook.position.set(0, topY + 0.155, 0);
      shirtGroup.add(hangerHook);

      // Remove loader suavemente
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 450);
      }
    }).catch(err => console.error("Erro ao carregar modelo da camisa:", err));

    /* ══════════════════════════════════════════════════════════════
       INTERATIVIDADE, CONTROLES DE ROTAÇÃO E ZOOM FLUÍDO
       ══════════════════════════════════════════════════════════════ */
    let isDragging = false;
    let autoRotate = true;
    let prevX = 0, prevY = 0;
    let targetRotY = 0;
    let targetRotX = 0;
    let currentRotY = 0;
    let currentRotX = 0;
    let targetZoom = 8.6;
    let currentZoom = 8.6;
    let snapTargetY = null;
    let touchDist = 0;

    function handleResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = w < h ? 50 : 32;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', handleResize);
    handleResize();

    cv.addEventListener('pointerdown', e => {
      isDragging = true;
      prevX = e.clientX;
      prevY = e.clientY;
      snapTargetY = null;
      cv.setPointerCapture(e.pointerId);
    });

    window.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;

      targetRotY += dx * 0.009;
      targetRotX = Math.max(-0.45, Math.min(0.45, targetRotX + dy * 0.005));

      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    cv.addEventListener('wheel', e => {
      e.preventDefault();
      targetZoom = Math.max(4.5, Math.min(13.0, targetZoom + e.deltaY * 0.006));
    }, { passive: false });

    cv.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (touchDist > 0) {
          targetZoom = Math.max(4.5, Math.min(13.0, targetZoom - (d - touchDist) * 0.015));
        }
        touchDist = d;
      }
    }, { passive: true });

    cv.addEventListener('touchend', () => { touchDist = 0; });

    const btnAuto = document.getElementById('btnAuto');
    function setCameraPreset(angleY, zoomLevel = 8.6) {
      autoRotate = false;
      btnAuto.textContent = '▶ GIRAR';
      btnAuto.classList.remove('active');

      const k = Math.round((shirtGroup.rotation.y - angleY) / (Math.PI * 2));
      snapTargetY = angleY + k * (Math.PI * 2);
      targetRotX = 0;
      targetZoom = zoomLevel;
    }

    document.getElementById('btnFront').addEventListener('click', () => setCameraPreset(0));
    document.getElementById('btnBack').addEventListener('click', () => setCameraPreset(Math.PI));
    document.getElementById('btnReset').addEventListener('click', () => {
      setCameraPreset(0, 8.6);
      autoRotate = true;
      btnAuto.textContent = '⏸ GIRAR';
      btnAuto.classList.add('active');
    });

    btnAuto.addEventListener('click', () => {
      autoRotate = !autoRotate;
      snapTargetY = null;
      btnAuto.textContent = autoRotate ? '⏸ GIRAR' : '▶ GIRAR';
      btnAuto.classList.toggle('active', autoRotate);
    });

    function animate() {
      requestAnimationFrame(animate);

      if (autoRotate && !isDragging) {
        targetRotY += 0.006;
      }

      if (snapTargetY !== null) {
        targetRotY += (snapTargetY - targetRotY) * 0.1;
        if (Math.abs(snapTargetY - targetRotY) < 0.002) snapTargetY = null;
      }

      currentRotY += (targetRotY - currentRotY) * 0.09;
      currentRotX += (targetRotX - currentRotX) * 0.09;
      currentZoom += (targetZoom - currentZoom) * 0.1;

      shirtGroup.rotation.y = currentRotY;
      shirtGroup.rotation.x = currentRotX;
      camera.position.z = currentZoom;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
